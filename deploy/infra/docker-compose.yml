services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dulieu}
      POSTGRES_USER: ${POSTGRES_USER:-dulieu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD phải đặt trong .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dulieu} -d ${POSTGRES_DB:-dulieu}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dlck-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dlck-net

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.22.7
    profiles: ["realtime"]
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      - ./clickhouse/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
      - ./clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
      - ${CLICKHOUSE_BACKUP_DIR:-./clickhouse-backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - dlck-net

volumes:
  pgdata:
  redisdata:
  chdata:

networks:
  dlck-net:
    external: true
